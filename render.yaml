services:
  - type: web
    name: orbit-library
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Deploy automatically only after the GitHub Actions checks pass.
    autoDeployTrigger: checksPass
    healthCheckPath: /books
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: cloud
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
